[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "autonomous-governance-laws"
version = "0.1.0"
description = "Constitutional runtime governance framework for autonomous AI agent systems — implementing Kirk LaSalle's 10 Laws for Intelligence Systems"
readme = "README.md"
license = {file = "LICENSE"}
requires-python = ">=3.10"
authors = [
    {name = "Kirk LaSalle", email = "governance@autonomouslaws.dev"},
]
keywords = [
    "ai-governance",
    "autonomous-agents",
    "safety",
    "runtime-enforcement",
    "cryptographic-governance",
    "10-laws",
]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "Intended Audience :: Science/Research",
    "License :: OSI Approved :: Apache Software License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
    "Topic :: Security :: Cryptography",
    "Topic :: Software Development :: Libraries :: Python Modules",
]
dependencies = []

[project.optional-dependencies]
crypto = ["cryptography>=42.0"]
dev = [
    "pytest>=8.0",
    "pytest-cov>=5.0",
]

[project.scripts]
agy-governance = "autonomous_governance.cli:main"
laws-lint = "autonomous_governance.linter:main"

[project.urls]
Homepage = "https://github.com/kirklasalle/AutonomousGovernanceLaws"
Documentation = "https://github.com/kirklasalle/AutonomousGovernanceLaws"
Repository = "https://github.com/kirklasalle/AutonomousGovernanceLaws"
Issues = "https://github.com/kirklasalle/AutonomousGovernanceLaws/issues"

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]

[tool.hatch.build.targets.wheel]
packages = ["src/autonomous_governance"]

[tool.hatch.build.targets.sdist]
include = [
    "/src",
    "/tests",
    "/README.md",
    "/LICENSE",
    "/pyproject.toml",
]
